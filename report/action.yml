name: receipts-report
description: >-
  Post the receipts verdict as a PR/issue comment and label. Privileged by design:
  it validates and renders an artifact and NEVER checks out or runs pull-request code.
author: receipts contributors
branding:
  icon: message-square
  color: green

inputs:
  github-token:
    description: Token with issues and pull-requests write access (usually secrets.GITHUB_TOKEN).
    required: true
  run-id:
    description: Id of the verify workflow run that produced the artifact (github.event.workflow_run.id).
    required: true
  repository:
    description: Repository that owns the run.
    default: ${{ github.repository }}
  artifact-name:
    description: Name of the verdict artifact.
    default: receipts-verdict

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Download verdict
      id: download
      continue-on-error: true # issues without a receipt upload nothing
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/receipts-in
        run-id: ${{ inputs.run-id }}
        repository: ${{ inputs.repository }}
        github-token: ${{ inputs.github-token }}

    - name: Validate and render
      id: render
      if: ${{ steps.download.outcome == 'success' }}
      shell: bash
      run: |
        set -euo pipefail
        export PYTHONPATH="$GITHUB_ACTION_PATH/../src"
        # The artifact is data from a less trusted workflow: `render` rebuilds it from a strict schema
        # and aborts on anything unexpected, before any token is used.
        python3 -m receipts render \
          --verdict "$RUNNER_TEMP/receipts-in/verdict.json" \
          --markdown-out "$RUNNER_TEMP/receipts-in/comment.md"

    - name: Post comment and label
      if: ${{ steps.render.outcome == 'success' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ inputs.repository }}
        NUMBER: ${{ steps.render.outputs.subject_number }}
        LABEL: ${{ steps.render.outputs.label }}
        COMMENT_FILE: ${{ runner.temp }}/receipts-in/comment.md
      run: bash "$GITHUB_ACTION_PATH/../scripts/post_report.sh"
